spring:
  application:
    name: archipel-libre

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/archipellibre}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:archipellibre}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:changeme}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

# API Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false
  paths-to-match: /api/**
  packages-to-scan: com.archipellibre.controller
  enable-spring-security: true
  use-management-port: false

# Logging
logging:
  level:
    com.archipellibre: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
