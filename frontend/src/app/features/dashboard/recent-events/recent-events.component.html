<mat-card class="recent-events-card">
  <mat-card-header>
    <mat-card-title>Recent Events</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div *ngIf="error" class="error-message">
      {{ error }}
    </div>

    <div *ngIf="loading" class="loading-spinner">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div *ngIf="!loading && !error">
      <div *ngIf="recentEvents.length === 0" class="no-events">
        <mat-icon>event_note</mat-icon>
        <p>No events available</p>
      </div>

      <div *ngIf="recentEvents.length > 0" class="events-list">
        <div *ngFor="let event of recentEvents" class="event-item" (click)="navigateToEvent(event.id)">
          <div class="event-date">
            <div class="date-day">{{ event.startDate | date: 'dd' }}</div>
            <div class="date-month">{{ event.startDate | date: 'MMM' }}</div>
          </div>
          <div class="event-details">
            <h3>{{ event.title }}</h3>
            <p class="event-location">
              <mat-icon>location_on</mat-icon>
              {{ event.location }}
            </p>
            <div class="event-status">
              <mat-chip-set>
                <mat-chip [color]="getStatusColor(event.status)" selected>
                  {{ event.status }}
                </mat-chip>
              </mat-chip-set>
            </div>
          </div>
        </div>
      </div>
    </div>
  </mat-card-content>

  <mat-card-footer *ngIf="!loading && !error && recentEvents.length > 0">
    <button mat-button color="primary" (click)="viewAllEvents()">
      View All Events
      <mat-icon>arrow_forward</mat-icon>
    </button>
  </mat-card-footer>
</mat-card>
