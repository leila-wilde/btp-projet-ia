<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Dashboard</h1>
    <p class="subtitle">Welcome back! Here's your activity overview.</p>
  </div>

  <div class="dashboard-content">
    <div class="grid-container">
      <!-- User Activity Overview -->
      <div class="grid-item full-width">
        <app-dashboard-overview></app-dashboard-overview>
      </div>

      <!-- Recent Events -->
      <div class="grid-item half-width">
        <app-recent-events></app-recent-events>
      </div>

      <!-- Forum Statistics -->
      <div class="grid-item half-width">
        <app-forum-stats></app-forum-stats>
      </div>
    </div>
  </div>
</div>
